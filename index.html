<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What Dog Breed Am I?</title>
  <link rel="icon" type="image/x-icon" href="/img/ideas.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <h1 class="text-center mt-4">🐶 What Dog Breed Am I?</h1>
  <p class="text-center text-muted">Answer all 4 questions, then click "Show Results".</p>

  <!-- Start quiz element -->
  <div class="container d-flex justify-content-center" id="question-1">
    <div class="card my-4 p-4 question-block" style="width: 75%;" data-question="1">
      <h4 class="mb-3">1. It's Saturday morning. What are you doing?</h4>
      <div class="row g-2">
        <div class="col-6">
          <button class="btn btn-outline-primary w-100 answer-btn" data-answer="A" data-points="1">😴 Staying in bed with snacks</button>
        </div>
        <div class="col-6">
          <button class="btn btn-outline-primary w-100 answer-btn" data-answer="B" data-points="2">🥞 Brunch with friends</button>
        </div>
        <div class="col-6">
          <button class="btn btn-outline-primary w-100 answer-btn" data-answer="C" data-points="3">🥾 Hiking somewhere new</button>
        </div>
        <div class="col-6">
          <button class="btn btn-outline-primary w-100 answer-btn" data-answer="D" data-points="4">📋 Planning my week</button>
        </div>
      </div>
    </div>
  </div>
  <!-- End quiz element -->

  <!-- Start quiz element -->
  <div class="container d-flex justify-content-center" id="question-2">
    <div class="card my-4 p-4 question-block" style="width: 75%;" data-question="2">
      <h4 class="mb-3">2. How would your friends describe you?</h4>
      <div class="row g-2">
        <div class="col-6">
          <button class="btn btn-outline-primary w-100 answer-btn" data-answer="A" data-points="1">😌 Laid-back</button>
        </div>
        <div class="col-6">
          <button class="btn btn-outline-primary w-100 answer-btn" data-answer="B" data-points="2">🤗 Sweet and loyal</button>
        </div>
        <div class="col-6">
          <button class="btn btn-outline-primary w-100 answer-btn" data-answer="C" data-points="3">🎉 Wild and fun</button>
        </div>
        <div class="col-6">
          <button class="btn btn-outline-primary w-100 answer-btn" data-answer="D" data-points="4">🛡️ Dependable and protective</button>
        </div>
      </div>
    </div>
  </div>
  <!-- End quiz element -->

  <!-- Start quiz element -->
  <div class="container d-flex justify-content-center" id="question-3">
    <div class="card my-4 p-4 question-block" style="width: 75%;" data-question="3">
      <h4 class="mb-3">3. Pick your dream vacation.</h4>
      <div class="row g-2">
        <div class="col-6">
          <button class="btn btn-outline-primary w-100 answer-btn" data-answer="A" data-points="1">🏖️ A hammock on the beach</button>
        </div>
        <div class="col-6">
          <button class="btn btn-outline-primary w-100 answer-btn" data-answer="B" data-points="2">🎢 A theme park with family</button>
        </div>
        <div class="col-6">
          <button class="btn btn-outline-primary w-100 answer-btn" data-answer="C" data-points="3">🏔️ A snowy mountain adventure</button>
        </div>
        <div class="col-6">
          <button class="btn btn-outline-primary w-100 answer-btn" data-answer="D" data-points="4">🗺️ A well-planned city tour</button>
        </div>
      </div>
    </div>
  </div>
  <!-- End quiz element -->

  <!-- Start quiz element -->
  <div class="container d-flex justify-content-center" id="question-4">
    <div class="card my-4 p-4 question-block" style="width: 75%;" data-question="4">
      <h4 class="mb-3">4. In a group project, you are...</h4>
      <div class="row g-2">
        <div class="col-6">
          <button class="btn btn-outline-primary w-100 answer-btn" data-answer="A" data-points="1">🙂 Happy to follow the plan</button>
        </div>
        <div class="col-6">
          <button class="btn btn-outline-primary w-100 answer-btn" data-answer="B" data-points="2">💛 Keeping everyone happy</button>
        </div>
        <div class="col-6">
          <button class="btn btn-outline-primary w-100 answer-btn" data-answer="C" data-points="3">💡 Bringing the crazy ideas</button>
        </div>
        <div class="col-6">
          <button class="btn btn-outline-primary w-100 answer-btn" data-answer="D" data-points="4">👑 The leader</button>
        </div>
      </div>
    </div>
  </div>
  <!-- End quiz element -->

  <div class="container d-flex justify-content-center">
    <button id="show-result" class="btn btn-success my-4">Show Results</button>
  </div>

  <!-- Output the result here -->
  <div class="container d-flex justify-content-center">
    <div id="result-container" class="card p-4 mb-4" style="width: 75%; display: none;">
      <h3>Your Result:</h3>
      <p id="result-text"></p>
    </div>
  </div>

  <!-- Connect to your script file here -->
  <script src="./js/script.js"></script>
</body>
</html>
